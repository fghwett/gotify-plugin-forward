name: Release

# 推送 v* 标签时触发（本地执行: task release VERSION=x.y.z）
# 自动使用 gotify/server 的最新版本构建，并发布 GitHub Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PLUGIN_NAME: gotify-plugin-forward
    steps:
      - uses: actions/checkout@v8
        with:
          fetch-depth: 0 # 生成变更记录需要完整历史与标签

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 解析最新 gotify 版本
        id: gotify
        run: echo "version=$(gh api repos/gotify/server/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

      - name: 安装依赖对齐工具
        run: go install github.com/gotify/plugin-api/cmd/gomod-cap@latest

      - name: 按 gotify ${{ steps.gotify.outputs.version }} 对齐依赖
        run: |
          wget -qO gotify-server.mod https://raw.githubusercontent.com/gotify/server/${{ steps.gotify.outputs.version }}/go.mod
          "$(go env GOPATH)/bin/gomod-cap" -from gotify-server.mod -to go.mod
          rm gotify-server.mod
          go mod tidy

      - name: 构建前端（SolidJS 配置页面）
        run: |
          corepack enable pnpm
          cd ui && pnpm install && pnpm build && touch ../app/web/.gitkeep

      - name: 获取 gotify 编译用 Go 版本并准备 QEMU（arm64 需要）
        run: |
          echo "GO_VERSION=$(wget -qO- https://raw.githubusercontent.com/gotify/server/${{ steps.gotify.outputs.version }}/GO_VERSION)" >> "$GITHUB_ENV"
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: 编译 linux-amd64
        run: |
          docker run --rm -v "$PWD:/proj" -v "$(go env GOPATH)/pkg/mod:/go/pkg/mod:ro" -w /proj \
            gotify/build:${GO_VERSION}-linux-amd64 \
            go build -mod=readonly -a -installsuffix cgo -buildmode=plugin \
            -o build/${PLUGIN_NAME}-linux-amd64.so /proj

      - name: 编译 linux-arm64
        run: |
          docker run --rm -v "$PWD:/proj" -v "$(go env GOPATH)/pkg/mod:/go/pkg/mod:ro" -w /proj \
            gotify/build:${GO_VERSION}-linux-arm64 \
            go build -mod=readonly -a -installsuffix cgo -buildmode=plugin \
            -o build/${PLUGIN_NAME}-linux-arm64.so /proj

      # 把「共享依赖必须与官方镜像完全一致」固化成发布门槛，
      # 不一致（如 gotify 新版升级了依赖）时发布失败，需人工更新 go.mod 的 replace
      - name: 校验与官方镜像的兼容性
        run: |
          IMAGE_TAG=${GOTIFY_VERSION#v}
          scripts/verify-compat.sh "$IMAGE_TAG" \
            build/${PLUGIN_NAME}-linux-amd64.so \
            build/${PLUGIN_NAME}-linux-arm64.so
        env:
          GOTIFY_VERSION: ${{ steps.gotify.outputs.version }}

      - name: 运行测试
        run: go test ./...

      - name: 创建 Release 并上传产物
        env:
          GH_TOKEN: ${{ github.token }}
          GOTIFY_VERSION: ${{ steps.gotify.outputs.version }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 变更记录：上一个 tag 到本次 tag 之间的提交
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:'- %s' "${PREV_TAG}..${TAG}" > changelog.txt || true
          fi
          cat > notes.md <<EOF
          # ${PLUGIN_NAME} ${TAG}

          基于 **gotify/server ${GOTIFY_VERSION}** 构建。

          ## 下载

          | 文件 | 适用平台 |
          |------|---------|
          | \`gotify-plugin-forward-linux-amd64.so\` | x86_64（常见云主机 / NAS） |
          | \`gotify-plugin-forward-linux-arm64.so\` | ARM64（树莓派 4/5、Apple Silicon 虚拟机等） |

          使用方法见 [README](https://github.com/${{ github.repository }}#readme)：
          将 \`.so\` 放入 gotify 的 \`data/plugins/\` 目录并重启服务。

          ## 变更记录

          $(cat changelog.txt 2>/dev/null || echo '- 初始发布')
          EOF
          gh release create "$TAG" --title "${TAG}" --notes-file notes.md \
            build/${PLUGIN_NAME}-linux-amd64.so \
            build/${PLUGIN_NAME}-linux-arm64.so
